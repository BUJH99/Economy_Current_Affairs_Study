                <p style="font-size:1.15rem; color:var(--text-secondary); margin-bottom:3rem;">
                    기계가 생각할 수 있을까에 대한 최초의 의문에서 출발하여, 딥러닝 암흑기와 부흥기를 거쳐 세상을 변화시키고 있는 거대 언어 모델(LLM)에 이르기까지의 70년 AI 역사와 핵심 이론을 한눈에 정리합니다.

            <article id="theory-ch1">
                <h2>Chapter 1. AI의 태동과 첫 번째 겨울 (1950s - 1970s)</h2>
                <p style="color:var(--text-tertiary); font-size:0.95rem; margin-bottom:2rem;">핵심 한 줄: 인간의 논리와 뉴런을 흉내 내려는 시도로 시작된 AI는 단층 퍼셉트론의 치명적 한계(XOR)를 만나며 첫 암흑기를 맞이했습니다.</p>

                <h3 style="margin-top:2rem; font-size:1.3rem; color:var(--text-primary); border-bottom:2px solid #e2e8f0; padding-bottom:0.5rem;">1-1. 질문의 시작: 튜링 테스트와 다트머스 회의</h3>
                <p>
                    현대 컴퓨터 과학의 아버지 <strong>앨런 튜링(Alan Turing)</strong>은 1950년 논문에서 "기계가 생각할 수 있을까?"(Can Machines Think?)라는 도발적인 질문을 던지며 기계의 지능을 판별하는 <strong>튜링 테스트(Turing Test)</strong>를 제안했습니다. 
                    이어 1956년 미국 다트머스 대학교에서 열린 워크숍에서 존 매카시(John McCarthy)가 <strong>'인공지능(Artificial Intelligence)'</strong>이라는 단어를 최초로 제정하며 정식 학문 분과로 첫걸음을 뗐습니다.
                </p>

                <h3 style="margin-top:2rem; font-size:1.3rem; color:var(--text-primary); border-bottom:2px solid #e2e8f0; padding-bottom:0.5rem;">1-2. 학파의 충돌: 기호주의 vs 연결주의</h3>
                <p>
                    초기 인공지능 연구는 인간 지능을 어떻게 모사할 것인가를 두고 두 개의 학파로 갈라섰습니다. 
                    하나는 인간의 논리 체계를 본뜨려 한 <strong>기호주의(Symbolism, 1950년대~1980년대 주류)</strong>였고, 다른 하나는 생물학적 뇌의 신경망 구조를 모사하고자 한 <strong>연결주의(Connectionism, 1940년대 태동~현재 주류)</strong>였습니다.
                </p>

                <!-- SVG: Branch Split of Symbolism vs Connectionism -->
                <div style="background:#fafafa; border:1px solid #e5e8eb; border-radius:12px; padding:1.2rem; margin:1.5rem 0; display:flex; justify-content:center; align-items:center; flex-direction:column; box-shadow:var(--shadow-card);">
                    <div style="font-size:0.85rem; font-weight:700; color:var(--text-secondary); margin-bottom:1rem;">📌 인공지능 모사 방식에 따른 두 학파의 노선 갈래</div>

                        <!-- Bottom branch (Connectionism) -->
                        <path d="M 100,75 C 130,75 120,120 160,120" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#branch-arrow-orange)"/>

                        <!-- Top Node: Symbolism -->
                        <rect x="165" y="10" width="135" height="40" rx="6" fill="#f0f7ff" stroke="#3182f6" stroke-width="1.5"/>
                        <text x="232.5" y="27" font-size="10" font-weight="bold" fill="#3182f6" text-anchor="middle">🧠 기호주의 (Symbolism)</text>
                        <text x="232.5" y="40" font-size="8.5" fill="#4e5968" text-anchor="middle">1950년대 ~ 1980년대 주도</text>

                        <!-- Top Right: Rule logic flowchart -->
                        <line x1="300" y1="30" x2="330" y2="30" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="2,2"/>
                        <rect x="335" y="15" width="150" height="30" rx="4" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>

                        <!-- Bottom Node: Connectionism -->
                        <rect x="165" y="100" width="135" height="40" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
                        <text x="232.5" y="117" font-size="10" font-weight="bold" fill="#ea580c" text-anchor="middle">🕸️ 연결주의 (Connectionism)</text>
                        <text x="232.5" y="130" font-size="8.5" fill="#4e5968" text-anchor="middle">1940년대 태동 ~ 현대 주도</text>

                        <!-- Bottom Right: Miniature neural net -->

                        <g transform="translate(340, 105)">
                            <!-- Layer 1 -->

                            <circle cx="10" cy="25" r="4" fill="#64748b" />

                            <line x1="39" y1="5" x2="56" y2="18" stroke="#cbd5e1" stroke-width="0.8"/>

                        </g>

                        <!-- Defs for Markers -->

                <h3 style="margin-top:2rem; font-size:1.15rem; color:var(--text-primary); border-left:4px solid #3182f6; padding-left:0.5rem; margin-bottom:1rem;">1-2-1. 기호주의의 전성기: 전문가 시스템(Expert System)의 작동 방식</h3>
                <p>
                    초기 컴퓨터 과학자들은 인간 지능이 결국 <strong>"규칙에 따른 기호 조작"</strong>에 불과하다고 보았습니다. 이 철학은 1970~1980년대에 이르러 <strong>전문가 시스템(Expert System)</strong>이라는 형태로 꽃을 피우며 당시 AI 시장의 대규모 투자를 독식(주도)하게 되었습니다.
                </p>
                <p>
                    전문가 시스템은 의사나 지질학자 등 인간 전문가가 가진 도메인 지식을 수천~수만 개의 <strong>"IF-THEN" 규칙</strong>으로 정의하여 지식베이스에 축적해 둔 뒤, 사용자의 상황(증상 등)이 입력되면 컴퓨터가 논리적인 추론 규칙을 조합해 스스로 진단과 해답을 도출하는 구조입니다. 감염병 진단 시스템인 MYCIN 등은 실제 의사 수준의 진단 능력을 보여주기도 했습니다.
                </p>

                <!-- SVG: Expert System Architecture -->
                <div style="background:#fafafa; border:1px solid #e5e8eb; border-radius:12px; padding:1.2rem; margin:1.5rem 0; display:flex; justify-content:center; align-items:center; flex-direction:column; box-shadow:var(--shadow-card);">
                    <div style="font-size:0.85rem; font-weight:700; color:var(--text-secondary); margin-bottom:1rem;">⚙️ 기호주의 전문가 시스템(Expert System) 아키텍처</div>

                <p style="margin-bottom:2.5rem;">
                    하지만 전문가 시스템은 <strong>"지식 획득의 병목 현상"</strong>이라는 거대한 벽에 부딪혔습니다. 분야별 전문가들의 직관을 일일이 추출해 예외 없는 기호 규칙으로 손 코딩하는 작업은 불가능에 가까웠고, 미처 다루지 못한 예외가 하나만 나와도 시스템이 먹통이 되는 취약점을 보였습니다. 결국 시스템 관리 비용이 기하급수적으로 증가하며 1980년대 말 관련 하드웨어/소프트웨어 시장이 붕괴했고, 이는 두 번째 AI 겨울을 초래하게 됩니다.
                </p>

                <h3 style="margin-top:2rem; font-size:1.15rem; color:var(--text-primary); border-left:4px solid #ea580c; padding-left:0.5rem; margin-bottom:1rem;">1-2-2. 연결주의의 철학: 상향식(Bottom-Up) 창발과 헵의 학습 규칙</h3>
                <p>
                    기호주의가 규칙을 위에서 주입하는 <strong>하향식(Top-Down)</strong> 접근이었다면, 연결주의는 바닥에서부터 스스로 지능이 생겨나게 하는 <strong>상향식(Bottom-Up)</strong> 접근입니다. 인간이 아기 때 규칙을 외우지 않고 수많은 경험(데이터)을 겪으며 뇌의 뉴런 가중치를 미세하게 조율해 스스로 사물을 인지하게 되는 과정과 같습니다.
                </p>
                <p>
                    이 철학적 사상의 핵심 근간은 1949년 캐나다의 심리학자 도널드 헵(Donald Hebb)이 발표한 <strong>헵의 학습 규칙(Hebbian Learning Rule)</strong>입니다. 헵은 <strong>"함께 활성화되는 뉴런들은 서로 연결고리가 더 단단해진다 (Neurons that fire together, wire together)"</strong>라는 뇌 생물학적 가설을 제시했습니다. 
                    신경망 모델에서 입력 데이터가 들어올 때 자주 같이 켜지는 가중치들을 점점 더 강하게 만들고, 그렇지 않은 가중치는 약화시키는 이 상향식 조율 방식은 현대 인공신경망 가중치 학습의 기본적 토대가 되었습니다.
                </p>

                <h3 style="margin-top:3rem; font-size:1.3rem; color:var(--text-primary); border-bottom:2px solid #e2e8f0; padding-bottom:0.5rem;">1-3. 연결망의 시초: 맥컬록-피츠 뉴런과 퍼셉트론</h3>
                <p>
                    현대 인공신경망의 가장 깊은 조상은 1943년 신경생리학자 워런 맥컬록(Warren McCulloch)과 수학자 월터 피츠(Walter Pitts)가 제안한 <strong>맥컬록-피츠 뉴런(McCulloch-Pitts Neuron)</strong> 모델입니다. 생물학적 뉴런의 정보 전달 방식을 '켜짐/꺼짐(0 또는 1)' 형태의 단순한 이진 논리 게이트로 수식화한 최초의 시도였습니다.

                <p>
                    이후 1958년 프랑크 로젠블랫(Frank Rosenblatt)은 이 모델을 확장하여 연결선마다 고유한 가중치(Weights)를 부여하고, 이를 데이터로부터 스스로 학습할 수 있도록 개량한 <strong>퍼셉트론(Perceptron)</strong>을 발표했습니다. 퍼셉트론은 입력값에 가중치를 곱해 더한 뒤 임계치를 통과시켜 출력을 결정하는 최초의 구현된 기계 학습 장치였습니다.
                </p>

                    그러나 1969년 마빈 민스키(Marvin Minsky)와 시모어 페퍼트(Seymour Papert)가 그들의 저서에서 <strong>"단일 계층 퍼셉트론으로는 XOR(배타적 논리합) 연산조차 해결할 수 없다"</strong>는 한계를 수학적으로 증명하며 큰 충격을 주었습니다.
                    이로 인해 자금 지원이 끊기며 1970년대 첫 번째 <strong>AI 겨울(AI Winter)</strong>이 찾아옵니다.
                </p>

                <!-- XOR 시각화 도구 -->

                    </h4>
                    <p style="font-size:0.95rem; color:var(--text-secondary); margin-bottom:1.5rem; line-height:1.6;">
                        XOR 문제가 인공지능 역사에 큰 겨울을 몰고 온 이유는 <strong>"직선 하나로 나눌 수 없는(선형 분리 불가능) 문제"</strong>였기 때문입니다.

                            <svg width="120" height="120" viewBox="0 0 120 120" style="overflow:visible; display:block; margin:0 auto;">

                                <!-- Grid Lines -->

                                <line x1="20" y1="20" x2="20" y2="100" stroke="#cbd5e1" stroke-width="1.5" />

                <h3 style="margin-top:3rem; font-size:1.3rem; color:var(--text-primary); border-bottom:2px solid #e2e8f0; padding-bottom:0.5rem;">1-4. 인공신경망의 본질: 보편적 함수 모사기와 학습의 목표</h3>
                <p>
                    인공신경망(Artificial Neural Network)은 본질적으로 <strong>"입력을 받아 원하는 출력을 계산해 내는 거대하고 정교한 수학적 함수(Function)"</strong>입니다. 
                    선형 변환(\(W x + b\))과 비선형 활성화 함수(\(\sigma\))가 겹겹이 얽힌 합성함수로 구성되어 있어, 이론상 세상의 모든 복잡한 형태의 실 함수 관계를 거의 흡사하게 흉내 낼 수 있는 <strong>보편적 근사 정리(Universal Approximation Theorem)</strong> 능력을 지니고 있습니다.
                </p>

                <!-- Formula Box: Neural Network Definition as a Composite Function -->
                <div class="formula-box" style="margin: 1.5rem 0; font-size:1rem; text-align:center; padding: 1.5rem; background:#f8f9fa; border:1px dashed var(--border-light); border-radius: var(--radius-sm);">
                    <div style="font-weight: 700; color: var(--color-indigo); margin-bottom: 0.5rem; font-size:0.95rem;">💡 인공신경망의 수학적 정의 (합성함수 구조)</div>
                    <div style="font-size: 1.25rem; margin: 0.75rem 0; color: var(--text-primary); font-family: 'Times New Roman', Times, serif; overflow-x: auto; white-space: nowrap; padding-bottom: 5px;">
                        $$y = f(x; W, b) = \sigma \left( W^{(L)} \sigma \left( \dots \sigma \left( W^{(1)}x + b^{(1)} \right) \dots \right) + b^{(L)} \right)$$
                    </div>
                    <div style="font-size: 0.85rem; color: var(--text-secondary); line-height: 1.6; text-align: left; max-width: 380px; margin: 0 auto;">
                        • \(x\) : 입력 벡터 (Input)<br>
                        • \(W^{(l)}x + b^{(l)}\) : \(l\)번째 층의 선형 변환 (Linear Transformation)<br>
                        • \(\sigma\) : 비선형 활성화 함수 (Non-linear Activation Function)<br>
                        • \(L\) : 총 레이어 깊이 (Layer Depth)
                    </div>
                </div>

                <p>
                    따라서 신경망 학습의 궁극적인 목표는 <strong>"예측 오차를 최소화하는 최적의 가중치(\(W\))와 편향(\(b\)) 조합을 찾아내는 것"</strong>입니다. 
                    이를 위해 실제 정답과 예측치 사이의 괴리(오차)를 수치화한 <strong>손실 함수(Loss Function)</strong>를 정의하고, 경사하강법(Gradient Descent)을 사용해 마치 산골짜기에서 공을 굴려 가장 낮고 깊은 골짜기(오차 최소 지점)로 내려보내듯 가중치를 지속해서 수정해 갑니다.
                </p>

                <!-- 3D Loss Landscape Canvas Container -->
                <div style="background:#fafafa; border:1px solid #e5e8eb; border-radius:12px; padding:1.5rem; margin:1.5rem 0; display:flex; justify-content:center; align-items:center; flex-direction:column; box-shadow:var(--shadow-card); position:relative;">
                    <div style="font-size:0.85rem; font-weight:700; color:var(--text-secondary); margin-bottom:1rem; display:flex; align-items:center; gap:6px; justify-content:space-between; width:100%;">
                        <span>📈 손실 함수 공간(Loss Landscape) 3D 시뮬레이션 (드래그하여 회전 / 휠로 줌)</span>
                        <span style="font-size:0.75rem; color:#ef4444; font-weight:bold; display:flex; align-items:center; gap:4px;">
                            <span style="display:inline-block; width:6px; height:6px; background:#ef4444; border-radius:50%; animation: pulse 1s infinite alternate;"></span>
                            경사하강 진행 중
                        </span>
                    </div>
                    
                    <div id="loss-landscape-3d" style="width: 100%; height: 320px; outline: none; cursor: grab; background: #fafafa; border-radius: 8px; overflow: hidden; border: 1px solid #e2e8f0;"></div>

                    <!-- Mathematical Slogan as an overlay badge -->
                    <div style="position:absolute; bottom:25px; right:25px; background:rgba(255,255,255,0.9); border:1px solid #e5e8eb; padding:0.6rem 1rem; border-radius:8px; box-shadow:var(--shadow-sm); z-index:10; pointer-events:none; backdrop-filter:blur(4px);">
                        <div style="font-size:0.75rem; font-weight:bold; color:#191f28; margin-bottom:2px;">🎯 학습 목표 (Optimization):</div>
                        <div style="font-size:0.85rem; font-weight:bold; color:#10b981; font-family:'Times New Roman', Times, serif;">
                            $$\arg\min_{W, b} \text{Loss}(W, b)$$
                        </div>
                    </div>
                </div>

                <p style="margin-bottom:3rem;">
                    즉, 인공신경망은 가상 공간의 경사면을 따라 오차(Loss)가 작아지는 방향으로 미끄러져 내려가는 <strong>경사하강 가중치 최적화 모델</strong>인 셈입니다. 이 기초를 마음에 새기고 2장의 다층 퍼셉트론과 오차역전파 알고리즘을 살펴보면, 이 거대한 함수가 어떻게 작동하고 학습하는지 훨씬 명확히 이해할 수 있습니다.
                </p>
            </article>

            <article id="theory-ch2">
                <h2>Chapter 2. 연결주의의 부활과 딥러닝의 서막 (1980s - 2000s)</h2>
                <p style="color:var(--text-tertiary); font-size:0.95rem; margin-bottom:2rem;">핵심 한 줄: 다층 퍼셉트론과 오차역전파 알고리즘의 등장으로 신경망은 부활했지만, 학습 과정에서 '기울기 소실'이라는 새로운 절벽을 마주합니다.</p>

                <h3 style="margin-top:2rem; font-size:1.3rem; color:var(--text-primary); border-bottom:2px solid #e2e8f0; padding-bottom:0.5rem;">2-1. 다층 퍼셉트론(MLP)의 등장과 오차역전파(Backpropagation)</h3>
                <p>
                    단층 퍼셉트론의 XOR 한계를 격파한 핵심 열쇠는 입력층과 출력층 사이에 <strong>은닉층(Hidden Layer)</strong>을 끼워 넣은 <strong>다층 퍼셉트론(MLP, Multi-layer Perceptron)</strong>이었습니다. 
                    은닉층의 뉴런들은 입력 데이터를 새로운 고차원 공간으로 매핑하고 여러 개의 선형 결정 경계를 조합하여 비선형적인 분류 영역을 형성해냅니다. 
                </p>
                <p>
                    하지만 층이 늘어나자 각 층 연결선에 놓인 수많은 가중치(Weights)들을 가르칠 방법이 막막했습니다. 
                    이를 해결한 알고리즘이 바로 1986년 데이비드 루멜하트(David Rumelhart), <strong>제프리 힌튼(Geoffrey Hinton)</strong> 등이 제안한 <strong>오차역전파(Backpropagation)</strong> 알고리즘입니다. 
                </p>
                <p>
                    역전파의 작동 원리는 간단하지만 강력합니다. 
                    먼저 데이터를 입력해 최종 예측값을 얻는 <strong>순전파(Feedforward)</strong> 과정을 거친 뒤, 출력값과 실제 정답을 대조해 오차(Loss, \(E\))를 구합니다. 
                    그 다음 이 오차 신호를 출력층에서 입력층 방향으로 거꾸로 쏘아 보냅니다(역전파). 
                    이 과정에서 오차가 각 뉴런의 연결선 가중치에 의해 얼마나 증폭되거나 감쇄되었는지를 수학적으로 계산하여, 오차를 줄이는 방향(경사하강법)으로 가중치들을 조율해 나갑니다.
                </p>

                <h3 style="margin-top:2.5rem; font-size:1.15rem; color:var(--text-primary); border-left:4px solid #8b5cf6; padding-left:0.5rem; margin-bottom:1rem;">2-1-1. 역전파의 수학적 심장: 미분의 연쇄 법칙 (Chain Rule)</h3>
                <p>
                    인공신경망은 가중치 곱셈과 활성화 함수가 겹겹이 얽혀 있는 거대한 <strong>합성함수(Composite Function)</strong>입니다. 
                    출력단의 에러 \(E\)가 저 깊은 입력단 연결선의 가중치 \(W\)에 도달할 때까지 어떻게 각 변수의 영향력을 무너뜨리지 않고 곱해 나가는지 설명해 주는 수학적 원리가 바로 <strong>연쇄 법칙(Chain Rule)</strong>입니다.
                </p>
                <p>
                    함수가 중첩되어 있을 때, 바깥쪽 함수부터 안쪽 함수까지 각각의 미분(변화율)을 구해 곱해주면 최종 미분값을 얻을 수 있습니다. 
                    예를 들어, 어떤 출력 \(z\)가 중간값 \(y\)에 종속되고, 다시 \(y\)가 입력 \(x\)에 종속될 때 (\(z = g(y)\), \(y = f(x)\)), \(x\)의 변화가 \(z\)에 미치는 최종 미분값 \(\frac{\partial z}{\partial x}\)는 아래와 같이 나누어 곱해집니다.
                </p>

                <p style="text-align:center; font-size:1.25rem; margin:1.5rem 0; font-family:'Times New Roman', Times, serif;">
                    $$\frac{\partial z}{\partial x} = \frac{\partial z}{\partial y} \cdot \frac{\partial y}{\partial x}$$
                </p>

                <!-- SVG: Chain Rule concept visualization -->
                <div style="background:#fafafa; border:1px solid #e5e8eb; border-radius:12px; padding:1.2rem; margin:1.5rem 0; display:flex; justify-content:center; align-items:center; flex-direction:column; box-shadow:var(--shadow-card);">
                    <div style="font-size:0.85rem; font-weight:700; color:var(--text-secondary); margin-bottom:1rem;">🔗 연쇄 법칙(Chain Rule) — 도미노식 미분값 전달 원리</div>

                <p style="margin-bottom:2.5rem;">
                    이 체인 링크와 같은 수식들의 곱을 거쳐, 오차역전파는 출력층 오차부터 순차적으로 미분값을 전달하고 곱해가며 가장 첫 레이어의 연결선 가중치까지 오차 영향력을 한 단계씩 배달합니다. 
                    즉, <strong>오차역전파는 이 연쇄 법칙(Chain Rule)을 신경망 전체 구조에 맞춰 시스템화한 일종의 자동 미분 도구</strong>인 셈입니다.
                </p>

                <h3 style="margin-top:2.5rem; font-size:1.15rem; color:var(--text-primary); border-left:4px solid #8b5cf6; padding-left:0.5rem; margin-bottom:1rem;">2-1-2. 왜 '깊은(Deep)' 신경망이어야 하는가? 계층적 특징 추출의 강력함</h3>
                <p>
                    이론상 단 하나의 은닉층만 있어도 뉴런의 개수가 무한하다면 어떤 연속 함수든 모사할 수 있습니다(보편적 근사 정리). 그렇다면 굳이 신경망을 '깊게(Deep)' 쌓을 필요가 있을까요? 
                    인공지능 연구자들은 이론적인 복잡도보다 <strong>매개변수 효율성(Parameter Efficiency)</strong>과 <strong>지능의 창발성</strong>에 집중했습니다.
                </p>
                <p>
                    얕고 지나치게 넓은(Wide) 신경망은 복잡한 데이터 관계를 학습할 때 뉴런 수가 <strong>기하급수적으로(지수적으로)</strong> 증가해야 하며, 일반화가 어려워 과적합(Overfitting)에 매우 취약합니다. 
                    반면, 신경망을 깊게 쌓으면 모델은 데이터를 <strong>"계층적 특징 추출(Hierarchical Feature Extraction)"</strong> 방식으로 학습합니다. 
                    가장 앞쪽 층(Low-level)에서는 점, 선, 면과 같은 원초적인 특징을 포착하고, 층을 거쳐 깊어질수록 이들을 조합하여 사물의 형태, 텍스처, 나아가 특정 객체의 전체 정체성(High-level)까지 점진적으로 추상화된 고도의 지능적 특징들을 적은 수의 파라미터(가중치)로도 표현해 낼 수 있게 됩니다.
                </p>

                        <!-- Plus Sign 1 -->

                        <!-- 2. Mid-level (Parts) -->
                        <g transform="translate(180, 20)">

                <p style="margin-bottom:2.5rem;">
                    이와 같은 계층적 융합 방식은 고수준 정보를 표현하기 위한 경우의 수를 뉴런이 기하급수적으로 다 외우게 만드는 대신, <strong>특징들을 효과적으로 재활용하고 조합(Feature Reuse)</strong>하게 함으로써 매개변수 폭증 문제를 효율적으로 돌파할 수 있게 만듭니다. 
                    이것이 오늘날 층을 깊게 쌓는 <strong>'딥러닝(Deep Learning)'</strong> 혁명의 강력한 이론적 배경입니다.
                </p>

                <h3 style="margin-top:2rem; font-size:1.3rem; color:var(--text-primary); border-bottom:2px solid #e2e8f0; padding-bottom:0.5rem;">2-2. 두 번째 겨울과 통계적 머신러닝의 시대 (기울기 소실의 난제)</h3>
                <p>
                    오차역전파 알고리즘은 혁신적이었으나, 신경망을 3층, 4층 이상으로 깊게 쌓으려 하자(Deep Neural Network) 예상치 못한 수학적 난관에 부딪혔습니다. 바로 <strong>기울기 소실(Vanishing Gradient)</strong> 문제입니다. 
                </p>

                <!-- Formula Box: Sigmoid Function and its Derivative -->
                <div class="formula-box" style="margin: 1.5rem 0; font-size:1rem; text-align:center; padding: 1.5rem; background:#f8f9fa; border:1px dashed var(--border-light); border-radius: var(--radius-sm);">
                    <div style="font-weight: 700; color: var(--color-indigo); margin-bottom: 0.5rem; font-size:0.95rem;">💡 시그모이드(Sigmoid) 함수와 미분</div>
                    <div style="font-size: 1.25rem; margin: 0.75rem 0; color: var(--text-primary); font-family: 'Times New Roman', Times, serif;">
                        $$\sigma(x) = \frac{1}{1 + e^{-x}}$$
                        $$\sigma'(x) = \sigma(x)(1 - \sigma(x)) \quad (\le 0.25)$$
                    </div>
                    <div style="font-size: 0.85rem; color: var(--text-secondary); line-height: 1.5; text-align: left; max-width: 380px; margin: 0 auto;">
                        • 미분값인 \(\sigma'(x)\)는 오직 \(x = 0\)일 때 최댓값인 <strong>\(0.25\)</strong>를 가집니다.<br>
                        • 입력 \(x\)의 절댓값이 커질수록(즉, 뉴런이 강하게 반응하거나 억제될수록) 미분값은 <strong>\(0\)에 무한히 수렴</strong>합니다(Gradient Saturation).
                    </div>
                </div>

                <p>
                    당시 뉴런의 활성화 함수로 사용되던 시그모이드(Sigmoid) 함수는 미분했을 때의 최댓값이 오직 \(0.25\)에 불과합니다. 역전파 과정에서 미분의 연쇄 법칙(Chain Rule)에 의해 각 층의 활성화 함수 미분값이 계속 곱해지는데, 4개 층만 거쳐도 곱해지는 값이 \(0.25^4 \approx 0.0039\)로 급격히 줄어들게 됩니다. 
                    결과적으로 입력층에 가까운 앞쪽 가중치들에는 오차 정보가 거의 0에 수렴하여 도달(전파)되므로, 앞쪽 뉴런들은 학습을 전혀 수행하지 못하고 멈춰버리는 현상이 발생했습니다. 
                </p>

                <h3 style="margin-top:3rem; font-size:1.3rem; color:var(--text-primary); border-bottom:2px solid #e2e8f0; padding-bottom:0.5rem;">2-3. 제프리 힌튼과 암흑기 속의 돌파구 (현대 딥러닝의 4대 구원투수)</h3>
                <p>
                    모두가 신경망 연구를 떠나며 비웃을 때도, 제프리 힌튼 교수와 캐나다 연구팀은 묵묵히 신경망의 한계들을 극복할 무기들을 개발해 나갔습니다. 그 결과 2000년대 중후반부터 2010년대 중반에 이르러 겨울을 녹일 네 가지 핵심 돌파구가 완성되었습니다.
                </p>
                <p>
                    첫째는 <strong>ReLU(Rectified Linear Unit)</strong> 활성화 함수의 채택입니다. 시그모이드와 달리 ReLU는 \(f(x) = \max(0, x)\)의 단순한 꺾인 직선 형태로, <strong>양수 영역의 미분(기울기)이 항상 \(1.0\)으로 일정</strong>합니다. 
                    연쇄 법칙에 의해 아무리 많은 층을 거슬러 올라가도 \(1 \times 1 \times 1 = 1\)이 곱해지므로, 기울기 소실을 물리적으로 차단하는 해결사가 되었습니다.
                </p>
                <p>
                    둘째는 <strong>드롭아웃(Dropout)</strong> 기법의 도입입니다. 학습 과정에서 무작위로 일정 비율의 뉴런 연결을 차단하여(꺼버려서) 남은 뉴런들만으로 학습을 강제하는 정규화 기법입니다. 
                    특정 뉴런들의 조합에 과도하게 의존하여 훈련 데이터만 암기해버리는 <strong>과적합(Overfitting)</strong> 문제를 근본적으로 해결해 주었습니다.
                </p>
                <p>
                    셋째는 <strong>가중치 초기화(Weight Initialization) 기법의 발견</strong>입니다. 
                    이전에는 가중치를 무작위 난수로 초기화하여 신호가 뒤로 갈수록 죽거나 너무 튀는 문제가 빈발했습니다. 2010년 자비에 글로럿(Xavier Glorot)과 2015년 카이밍 헤(Kaiming He)는 각 층의 입력 및 출력 뉴런 수에 맞게 초기 가중치의 통계적 분산을 설계하는 **Xavier 초기화** 및 **He 초기화** 기법을 개발하여 신경망 내부 신호 세기를 최초부터 끝까지 흔들림 없이 전파하는 데 성공했습니다.
                </p>
                <p>
                    넷째는 <strong>배치 정규화(Batch Normalization)의 도입</strong>입니다. 
                    2015년 구글 연구진이 제안한 이 기법은 학습 과정에서 각 층의 데이터 분포가 시시각각 뒤틀어지는 현상(Internal Covariate Shift)을 방지하기 위해, 미니배치 단위로 평균을 0, 분산을 1로 실시간 강제 통일하여 층 사이에 끼워 넣습니다. 
                    이를 통해 학습 속도가 수 배 이상 도약했고, 가중치 값의 급격한 편향을 막아 학습 안정성을 원천적으로 격상시켰습니다.
                </p>

                <h3 style="margin-top:2rem; font-size:1.3rem; color:var(--text-primary); border-bottom:2px solid #e2e8f0; padding-bottom:0.5rem;">2-4. 데이터 특화형 아키텍처의 선구적 출현: 시퀀스를 위한 RNN과 공간을 위한 CNN</h3>
                <p>
                    신경망이 단순 다층 퍼셉트론(MLP)의 일차원적 구조를 탈피하면서, 데이터의 고유한 차원적 특징에 특화된 두 갈래의 독창적인 아키텍처가 선구적으로 고안되었습니다. 
                    하나는 시간적 순서가 있는 데이터를 위해 앞선 기억을 수평 순환시키는 <strong>RNN 계열</strong>이며, 다른 하나는 격자 형태의 공간 데이터를 커널 필터로 요약하는 <strong>CNN 계열</strong>입니다.
                </p>

                <!-- Part 1: RNN & LSTM/GRU -->
                <h4 style="margin-top:1.5rem; font-size:1.1rem; color:var(--text-primary);">A. 시간의 흐름을 학습하는 순환 신경망 (RNN, LSTM, GRU)</h4>
                <p>
                    <strong>순환 신경망(RNN, Recurrent Neural Network)</strong>은 시계열이나 자연어 등 데이터의 순차적 문맥을 이해하기 위해 기억 저장소를 내부에 삽입한 형태입니다. 
                    그 역사는 <strong>1982년 존 홉필드(John Hopfield)의 Hopfield Network(연상 기억)</strong>로 출발하여, <strong>1986년 마이클 조던(Michael I. Jordan)의 Jordan Network</strong>(출력층 피드백 모델)를 거쳐, <strong>1990년 제프리 엘만(Jeffrey Elman)의 Elman Network(Simple Recurrent Network)</strong>에 이르러 완성되었습니다. 
                    은닉층의 신호가 가중치 \(W_{hh}\)를 통해 다음 시점으로 끝없이 순환하게 만듦으로써 가변 길이 데이터를 성공적으로 읽어내기 시작했습니다 (\(h_t = \tanh(W_{hh} h_{t-1} + W_{xh} x_t + b_h)\)).
                </p>
                <p>
                    하지만 고전 RNN은 시퀀스가 조금만 길어져도 과거 기억이 전량 소실되는 기울기 소실 절벽에 부딪혔습니다. 
                    이를 격파하고자 <strong>1997년 제프 슈미트후버(Jürgen Schmidhuber)와 제프 호프라이터(Sepp Hochreiter)</strong>가 컨베이어 벨트 모양의 셀 상태(\(C_t\))와 3대 문지기 게이트를 결합한 <strong>LSTM(Long Short-Term Memory)</strong>을 제안했습니다. 
                    이후 현대적 AI 빅뱅이 시작된 <strong>2014년 조경현 교수 연구팀</strong>이 셀 상태와 은닉 상태를 통합하여 연산 효율을 높인 경량 버전인 <strong>GRU(Gated Recurrent Unit)</strong>를 내놓으며 시퀀스 처리 기술을 완성 단계로 인도했습니다.
                </p>

                <!-- Part 2: CNN & LeNet-5 -->
                <h4 style="margin-top:2.5rem; font-size:1.1rem; color:var(--text-primary);">B. 공간 정보를 추출하는 합성곱 신경망 (CNN & LeNet-5)</h4>
                <p>
                    이미지와 같이 인접한 픽셀 간의 밀접한 관계를 가진 격자형 데이터를 처리하기 위해 개발된 것이 <strong>합성곱 신경망(CNN, Convolutional Neural Network)</strong>. 
                    그 기원은 <strong>1980년 후쿠시마 구니히코(Kunihiko Fukushima)가 생물학의 시각 피질 세포 구조에서 힌트를 얻어 제안한 Neocognitron</strong>으로 거슬러 올라갑니다.
                </p>
                <p>
                    이후 <strong>1998년 얀 르쿤(Yann LeCun) 교수 연구팀</strong>이 오차역전파 학습이 가능한 현대적 아키텍처로 완성시킨 것이 바로 <strong>LeNet-5</strong>입니다. 
                    LeNet-5는 입력 이미지 위로 일정한 크기의 격자 필터를 미끄러뜨리며 특징을 검출해내는 <strong>합성곱(Convolution)</strong> 레이어와 해상도를 줄여 이동 불변성을 획득하는 <strong>서브샘플링(Subsampling/풀링)</strong> 레이어, 그리고 1차원으로 합치는 <strong>전결합(Fully Connected)</strong> 레이어를 순차적으로 적층하여 수표 번호 인식 등에 큰 족적을 남겼습니다.
                </p>

                <h2>Chapter 3. 딥러닝 빅뱅과 인식 혁명 (2010s)</h2>
                <p style="color:var(--text-tertiary); font-size:0.95rem; margin-bottom:2rem;">핵심 한 줄: 대용량 데이터(ImageNet)와 강력한 컴퓨팅 엔진(GPU), 그리고 개선된 알고리즘이 결합하며 바야흐로 '딥러닝 빅뱅'의 서막이 올랐습니다.</p>

                <h3 style="margin-top:2rem; font-size:1.3rem; color:var(--text-primary); border-bottom:2px solid #e2e8f0; padding-bottom:0.5rem;">3-1. 2012년 이미지넷과 AlexNet의 압승</h3>
                <p>
                    2012년은 AI 역사에서 가장 극적인 해 중 하나입니다. 컴퓨터가 대량의 이미지를 분류하는 대회인 <strong>ImageNet Challenge (ILSVRC)</strong>에서 제프리 힌튼 교수 팀의 대학원생 알렉스 크리제프스키(Alex Krizhevsky)가 설계한 심층 신경망 <strong>AlexNet</strong>이 등장했습니다. 
                    AlexNet은 에러율을 무려 기존의 26% 수준에서 16%로 떨어뜨리며 압도적인 1위를 차지했습니다. 
                    당시 AlexNet은 <strong>NVIDIA GPU</strong> 2대를 엮어 행렬 병렬 연산을 가속화함으로써 컴퓨터 과학자들에게 "인공지능을 구현하기 위해선 GPU 연산 엔진이 해답"이라는 새로운 패러다임을 확립해 주었습니다.
                </p>

                <h3 style="margin-top:2rem; font-size:1.15rem; color:var(--text-primary); border-bottom:1px dashed #cbd5e1; padding-bottom:0.3rem;">3-1-A. AlexNet의 5대 알고리즘적 혁신과 기법</h3>
                <p>
                    AlexNet이 ImageNet 대회에서 타 모델들을 가차 없이 무너뜨린 비결은 병렬 GPU 연산 외에도, 현대 딥러닝 학습 규격의 기반을 마련한 <strong>5가지 알고리즘적 혁신</strong>에 있습니다. 
                    단순히 층을 쌓은 것을 넘어, 깊은 망이 안정적으로 수렴하고 오버피팅에 걸리지 않도록 고안된 장치들입니다.
                </p>
                <p>
                    첫째는 <strong>ReLU 활성화 함수의 전면적 채택</strong>입니다. 기존의 Sigmoid나 Tanh 대신 \(f(x) = \max(0, x)\) 형태의 선형 램프 함수를 활용함으로써, 기울기 소실을 예방하고 학습 수렴 속도를 무려 <strong>6배 이상 가속</strong>시켰습니다. 
                    둘째는 <strong>드롭아웃(Dropout, 50% 비율)</strong> 기법의 탑재입니다. 학습 시 매 단계마다 무작위로 절반의 뉴런을 연결선에서 비활성화하여, 신경망이 특정한 소수 뉴런에만 병적으로 의존하는 동조(Co-adaptation) 현상을 완전히 원천 차단했습니다.
                </p>
                <p>
                    셋째는 <strong>중첩 맥스 풀링(Overlapping Max Pooling)</strong>입니다. 윈도우 크기와 보폭을 동일하게 설정해 데이터를 건너뛰며 필터링하던 기존 격자 풀링과 달리, 윈도우 크기 3, 보폭 2로 겹쳐 풀링함으로써 특징의 기하학적 정보 유실을 억제하고 오버피팅을 약 0.4%p 낮추었습니다. 
                    넷째는 <strong>이미지 데이터 증강(Data Augmentation)</strong>입니다. 학습셋 이미지를 좌우 대칭 반전시키고 무작위로 위치를 자르거나(Crop), RGB 채널 별로 주성분 분석(PCA) 기반 노이즈를 섞어 학습 데이터를 물리적으로 수배 이상 부풀려 과대적합을 정복했습니다.
                </p>
                <p>
                    다섯째는 <strong>로컬 반응 정규화(LRN, Local Response Normalization)</strong>입니다. 뇌 시각 신경세포의 '측면 억제(Lateral Inhibition)' 메커니즘을 모사하여, 인접한 특정 피처 맵 채널에서 한 활성화 강도가 매우 높으면 주변 채널의 강도를 상대적으로 눌러주어 망 전반의 특징적 대비(Contrast)를 고르게 유지시켰습니다 (이는 현대의 BatchNorm 레이어로 발전하는 시초가 됨).
                </p>

                <h3 style="margin-top:2rem; font-size:1.3rem; color:var(--text-primary); border-bottom:2px solid #e2e8f0; padding-bottom:0.5rem;">3-2. 딥러닝 인프라 빅뱅: 대용량 데이터와 GPU 병렬 연산의 시너지</h3>
                <p>
                    AlexNet이 일으킨 기적의 이면에는 알고리즘의 고도화뿐만 아니라 <strong>인프라 하드웨어의 패러다임 시프트</strong>가 결정적인 역할을 했습니다. 
                    과거 CPU 기반 싱글 코어 순차 연산 중심의 학습 환경은 신경망 가중치가 수백만 개만 되어도 연산 시간이 수 주 이상 걸리는 물리적 한계에 부딪혔습니다.
                </p>
                <p>
                    AlexNet은 수천 개의 미세 코어가 동시에 단순 산술 연산을 수행하는 <strong>GPU(Graphic Processing Unit)의 대규모 병렬성</strong>을 신경망 훈련에 이식했습니다. 
                    NVIDIA GPU 2대를 가동하여 모델 가중치를 절반씩 나누어 분산 연산함으로써 학습 속도를 수십 배 이상 단축시켰고, <strong>CUDA 플랫폼</strong>을 통한 하드웨어 제어가 딥러닝 엔지니어링의 표준 문법으로 정착하는 계기를 마련했습니다.
                </p>
                <p>
                    여기에 인터넷 보급으로 폭증한 디지털 데이터 자원인 <strong>ImageNet(1,400만 장 이상의 라벨링 이미지 데이터셋)</strong>이 인풋으로 결합하면서, 심층 신경망이 고질적으로 겪던 데이터 부족으로 인한 오버피팅(Overfitting)을 물리적으로 해소했습니다. 
                    결국 <strong>"빅데이터 + GPU 병렬 하드웨어 + 오차역전파 신경망"</strong>의 삼위일체가 합치되면서 현대 딥러닝의 부흥기가 공식 개막한 것입니다.
                </p>

                <h3 style="margin-top:2rem; font-size:1.3rem; color:var(--text-primary); border-bottom:2px solid #e2e8f0; padding-bottom:0.5rem;">3-3. 기울기 소실 장벽을 깨부순 152층의 기적: ResNet (2015)</h3>
                <p>
                    AlexNet 이후 딥러닝 연구자들은 모델의 층(Depth)을 더 깊게 쌓을수록 표현력이 기하급수적으로 증가한다는 사실을 깨달았습니다. 
                    그러나 20층 이상 깊어지자 심각한 장벽에 부딪혔습니다. 
                    단순히 기울기 소실이나 오버피팅 때문이 아니라, 레이어가 너무 많아지면 오히려 훈련 에러가 더 나빠지는 <strong>망의 퇴화 문제(Degradation Problem)</strong>가 발생한 것입니다. 
                    아무리 역전파를 해도 미분값이 무수히 겹곱해지는 과정에서 정보가 왜곡되어 최적화 난이도가 한계에 달했습니다.
                </p>
                <p>
                    이 교착 상태를 일거에 파괴한 돌파구가 바로 <strong>2015년 카이밍 허(Kaiming He) 연구팀이 제안한 ResNet(Residual Network)</strong>입니다. 
                    ResNet은 입력 레이어의 값을 가중치 연산 레이어들을 건너뛰어 출력에 직접 더해버리는 <strong>잔차 연결(Residual Connection / Skip Connection)</strong>을 도입했습니다. 
                    기존의 레이어가 입력 \(x\)에 대해 완전한 최적 타깃 매핑 \(H(x)\)를 직접 학습했다면, ResNet은 출력과 입력의 차이인 잔차 \(F(x) = H(x) - x\)만을 학습하도록 매커니즘을 수정했습니다 (\(H(x) = F(x) + x\)).
                </p>
                <p>
                    이 설계는 수학적으로 강력한 기울기 보증 수표 역할을 합니다. 
                    역전파 과정에서 \(H(x)\)를 미분하면 \(\frac{\partial H}{\partial x} = \frac{\partial F}{\partial x} + 1\)이 됩니다. 
                    이 뒤쪽의 <strong>\(+1\)이라는 상수 항</strong> 덕분에 가중치 레이어의 미분값(\(\frac{\partial F}{\partial x}\))이 설령 0에 가깝게 소실(Vanishing)되더라도, 에러 신호는 어떠한 장애물도 없이 이전 레이어로 온전히 100% 흘러 들어가는 <strong>"그라디언트 고속도로"</strong>가 개통됩니다. 
                    이혁신을 바탕으로 인공지능은 종전 19층 수준(VGG-19)에 머물던 한계를 부수고, <strong>152층(ResNet-152)</strong>을 넘어 1000층 이상의 심층 모델도 막힘없이 훈련시키는 기적을 달성했습니다.
                </p>

            <article id="theory-ch4">
                <h2>Chapter 4. 트랜스포머(Transformer)와 LLM의 시대 (2017 - 현재)</h2>
                <p style="color:var(--text-tertiary); font-size:0.95rem; margin-bottom:2rem;">핵심 한 줄: 단어를 순차적으로 분석하던 한계에서 탈피하여 문장 전체를 한번에 처리하는 Attention이 등장하면서 AI는 스케일링의 우주로 나아가게 되었습니다.</p>

                
                <h3 style="margin-top:2rem; font-size:1.3rem; color:var(--text-primary); border-bottom:2px solid #e2e8f0; padding-bottom:0.5rem;">4-1. 패러다임 시프트: Attention Is All You Need</h3>
                <p>
                    2017년 Google 연구진은 기존 시퀀스 모델의 표준이었던 RNN과 CNN을 완전히 배제하고, 오로지 어텐션 메커니즘으로만 문장 내 모든 단어 간의 관계를 매핑하는 혁신적인 아키텍처 <strong>Transformer</strong>를 발표했습니다. 
                    기존 RNN이 단어를 하나씩 순차적으로 읽으며 누적해가던 방식은 문장이 길어질 때 정보 유실과 연산의 직렬화(병목)를 초래했습니다. 
                    반면, 트랜스포머는 전체 문장을 단 한 번의 행렬 연산으로 처리하여 극대화된 <strong>병렬 연산 능력</strong>을 확보하고 대규모 인프라(GPU)와의 최상의 궁합을 보였습니다.
                </p>
                <p>
                    이 핵심에는 정보 검색 데이터베이스의 개념을 이식한 <strong>Scaled Dot-Product Attention</strong>이 있습니다. 
                    특정 단어 벡터가 들어오면, 질문을 던지는 주체인 <strong>Query(Q)</strong>, 비교 대상의 색인(태그) 역할을 하는 <strong>Key(K)</strong>, 그리고 해당 단어가 실제로 담고 있는 실체 정보인 <strong>Value(V)</strong>로 투영됩니다. 
                    Query와 Key 벡터 간의 내적(\(Q K^T\))을 통해 단어 간 유사도를 계산한 후, 차원의 크기인 \(\sqrt{d_k}\)로 나누어 스케일링을 수행합니다. 
                    여기에 Softmax 활성화 함수를 씌워 합이 1인 가중치 비율을 획득하고, 이를 Value 행렬과 곱하여 최종 문맥이 반영된 특징 벡터를 산출합니다 (\(\text{Attention}(Q,K,V) = \text{softmax}(\frac{Q K^T}{\sqrt{d_k}}) V\)).
                </p>
                <p>

                <h3 style="margin-top:2rem; font-size:1.3rem; color:var(--text-primary); border-bottom:2px solid #e2e8f0; padding-bottom:0.5rem;">4-3. 스케일링 법칙(Scaling Law)과 창발적 능력(Emergent Ability)</h3>
                <p>
                    OpenAI는 GPT-1(1.1억 개 파라미터), GPT-2(15억 개)를 거쳐 2020년 <strong>GPT-3(1,750억 개)</strong>를 발표하며 인공지능 학계를 송두리째 흔들었습니다.
                    이와 함께 <strong>스케일링 법칙(Scaling Law)</strong>이 증명되었습니다. 
                    모델 크기(Parameters), 학습 데이터 크기(Tokens), 그리고 소모되는 컴퓨터 연산량(Compute)이 정비례적으로 늘어날수록 에러율은 지수 함수 그래프를 따라 매끄럽게 감소한다는 성질입니다.
                </p>
                <p>
                    특히 파라미터 수가 특정 임계점(보통 1,000억 개 내외)을 돌파하는 순간, 이전의 작은 모델에서는 전혀 불가능했던 <strong>산술 연산, 논리 추론, 프로그래밍 코드 작성</strong> 등의 기묘한 지능들이 갑작스럽게 발현되는 <strong>창발적 능력(Emergent Abilities)</strong>이 나타남이 밝혀졌습니다. 
                    이로써 AI는 복잡하고 어려운 특정 기능용 모델을 각각 설계하던 시대에서 벗어나, 거대하고 범용적인 LLM을 하나 만든 뒤 이를 튜닝(Fine-tuning / Alignment)하여 사용하는 거대 모델 독주 시대로 전환하게 되었습니다.
                </p>
                <p>
                    더 자세히는, 2020년 OpenAI의 자레드 카플란(Jared Kaplan) 연구팀이 발표한 <strong>스케일링 법칙(Scaling Law)</strong>에 따르면, 모델 매개변수 수(\(N\)), 데이터셋 크기(\(D\)), 누적 학습 연산량(\(C\)) 중 오직 한두 가지에만 병목이 걸리지 않는다면 <strong>테스트 손실(Loss)은 스케일 크기에 대해 멱함수 법칙(Power Law)을 따르며 예측 가능하게 하강</strong>합니다. 
                    즉, \(L(N) \approx (N_c/N)^{\alpha_N}\)과 같이 로그-로그 그래프 상에서 완벽한 직선 형태로 오차가 내려갑니다. 
                    이는 "돈과 전기, 데이터를 대량으로 부어 넣기만 하면 모델 성능은 예측 가능한 범위 안에서 확실하게 수렴한다"는 거대 플랫폼 빅테크들의 확신을 주어 인프라 투자 전쟁을 촉발했습니다.
                </p>
                <p>
                    동시에 발견된 <strong>창발적 능력(Emergent Ability)</strong>은 이러한 선형적 성능 증가 법칙 이면의 신비로운 전이 현상입니다. 
                    MMLU나 GSM8K 같은 초등 수준 수학 문장제 추론, 혹은 고단계 상식 추론 평가는 모델 파라미터가 <strong>100억~1,000억 개 임계치</strong>를 넘어서기 전까지는 정답률이 무작위 추첨 수준(0~10%)에 고정되어 전혀 발전이 없는 것처럼 보입니다. 
                    그러나 이 물리적인 임계 장벽을 돌파하는 순간, 마치 물이 100도씨에서 끓어 수증기로 상전이(Phase Transition)를 일으키듯 <strong>지능이 갑자기 폭발하며 정답률이 70~80% 이상으로 급상승</strong>합니다. 
                    이로써 LLM은 단순한 문장 복사를 넘어 논리적 사고의 흐름을 전개하는 추론 엔진으로 변모하게 되었습니다.
                </p>
